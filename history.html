<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee6">
<title>History · Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee6;--paper-2:#fffdfa;--card:#ffffff;
    --ink:#191410;--ink-2:#6d645a;--ink-3:#a2978b;
    --line:#e4dbcd;--line-2:#d3c7b5;
    --ember:#e8622a;--fill:rgba(25,20,16,.04);--fill-2:rgba(25,20,16,.07);
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --spring:cubic-bezier(.34,1.28,.64,1);
  }
  html[data-theme="dark"]{
    --paper:#100e0c;--paper-2:#191613;--card:#1a1714;
    --ink:#f6f0e8;--ink-2:#b3a89c;--ink-3:#877e74;
    --line:#2b2521;--line-2:#3b332c;
    --fill:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.09);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.55 var(--sans);
    padding:0 0 calc(44px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(70% 46% at 0% -8%, rgba(232,98,42,.12), transparent 64%),
      linear-gradient(180deg,rgba(255,250,242,.7) 0%,transparent 46%);
  }
  html[data-theme="dark"] body::before{
    background:radial-gradient(70% 46% at 0% -8%, rgba(232,98,42,.16), transparent 64%);
  }
  .page{max-width:540px;margin:0 auto;padding:0 22px}

  .top{display:flex;align-items:center;justify-content:space-between;padding:26px 0 0}
  .back{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink-2);
    font:600 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;
  }
  .back:active{color:var(--ember)}
  h1{
    font-family:var(--serif);font-style:italic;font-weight:500;font-size:46px;
    line-height:1;letter-spacing:-.02em;margin:22px 0 4px;
  }
  .sub{color:var(--ink-3);font-size:12px;margin:0 0 20px}

  .filter{position:relative;margin:0 0 22px}
  #f{
    width:100%;height:48px;border-radius:13px;border:1px solid var(--line-2);
    background:var(--card);color:var(--ink);outline:none;
    font:500 14px var(--sans);padding:0 44px 0 40px;
    caret-color:var(--ember);transition:border-color .18s ease;
  }
  #f:focus{border-color:var(--ember)}
  #f::placeholder{color:var(--ink-3);font-weight:400}
  .fmag{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
  .fclear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:9px;border:0;background:transparent;
    color:var(--ink-3);font-size:15px;cursor:pointer;display:none;
  }
  .filter.has .fclear{display:block}

  .block{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(25,20,16,.035);
  }
  html[data-theme="dark"] .block{box-shadow:none}
  .head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .head h2{margin:0;flex:0 0 auto;font:600 9.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
  .head .count{font:500 10px var(--sans);color:var(--ink-3);flex:0 0 auto}
  .head .line{flex:1 1 auto;height:1px;background:var(--line)}
  .head button{
    flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
    font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:2px 0;
  }
  .head button:active{color:var(--ember)}

  .list{display:flex;flex-direction:column}
  .row{
    display:flex;align-items:center;gap:11px;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:13px;
    transition:opacity .15s ease,transform .15s ease;
  }
  .row:last-child{border-bottom:0;padding-bottom:0}
  .row.gone{opacity:0;transform:translateX(6px)}
  .row a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ic{
    width:17px;height:17px;border-radius:5px;flex:0 0 auto;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;font:600 9px/1 var(--sans);color:#fff;
  }
  .row .ic img{position:absolute;inset:0;width:100%;height:100%;border-radius:5px;display:block}
  .row .q{flex:1 1 auto;min-width:0}
  .row em{
    font-style:normal;color:var(--ink-3);font-size:11px;flex:0 0 auto;
    font-variant-numeric:tabular-nums;
  }
  .row .del{
    flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);
    font:400 16px/1 var(--sans);padding:2px 0 2px 8px;cursor:pointer;
  }
  .row .del:active{color:var(--ember)}
  .empty{color:var(--ink-3);font-size:12.5px;padding:2px 0}
  footer{margin-top:22px;text-align:center;color:var(--ink-3);font:500 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="back" href="index.html">← Valley</a>
    <span class="back" id="themeLabel"></span>
  </div>

  <h1>History</h1>
  <p class="sub" id="sub">—</p>

  <div class="filter" id="filterwrap">
    <span class="fmag">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.7-3.7"/>
      </svg>
    </span>
    <input id="f" type="search" placeholder="Filter history" autocomplete="off" spellcheck="false">
    <button class="fclear" id="fclear" aria-label="Clear filter">×</button>
  </div>

  <div class="block">
    <div class="head">
      <h2>Searches</h2><span class="count" id="cSearch"></span>
      <span class="line"></span><button id="clearSearch">Clear</button>
    </div>
    <div class="list" id="searches"></div>
  </div>

  <div class="block">
    <div class="head">
      <h2>Pages opened</h2><span class="count" id="cOpened"></span>
      <span class="line"></span><button id="clearOpened">Clear</button>
    </div>
    <div class="list" id="opened"></div>
  </div>

  <footer>Stored in this browser only</footer>
</div>

<script>
(function () {
  var K = { searches: 'hp.searches', opened: 'hp.opened' };

  function read(k, fb) {
    try { var r = localStorage.getItem(k); if (!r) return fb;
          var v = JSON.parse(r); return v == null ? fb : v; } catch (e) { return fb; }
  }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function nice(u) {
    var h = host(u); if (!h) return u;
    var p = h.split('.'); if (p.length > 1) p.pop();
    var skip = { www: 1, en: 1, m: 1, mobile: 1 }, name = '';
    for (var i = 0; i < p.length; i++) if (!skip[p[i]]) { name = p[i]; break; }
    if (!name) name = p[0] || h;
    return name.charAt(0).toUpperCase() + name.slice(1);
  }
  function tint(u) {
    var h = host(u) || 'x', n = 0;
    for (var i = 0; i < h.length; i++) n = (n * 31 + h.charCodeAt(i)) % 360;
    return 'hsl(' + n + ', 52%, 42%)';
  }
  function searchText(x) { return typeof x === 'string' ? x : (x && x.q) || ''; }
  function ago(ts) {
    if (!ts) return '';
    var s = Math.max(1, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 604800) return Math.round(s / 86400) + 'd ago';
    return new Date(ts).toLocaleDateString();
  }
  function makeIcon(u) {
    var box = document.createElement('div');
    box.className = 'ic'; box.style.background = tint(u);
    box.textContent = (nice(u) || '?').charAt(0).toUpperCase();
    var img = document.createElement('img');
    img.alt = ''; img.loading = 'lazy';
    var h = host(u);
    var srcs = ['https://' + h + '/favicon.ico',
                'https://icons.duckduckgo.com/ip3/' + h + '.ico',
                'https://www.google.com/s2/favicons?sz=64&domain=' + h];
    var n = 0;
    function next() { n++; if (n < srcs.length) { img.src = srcs[n]; return; }
                     if (img.parentNode) img.parentNode.removeChild(img); }
    img.onerror = next;
    img.onload = function () { if (!img.naturalWidth || img.naturalWidth < 16) next(); };
    img.src = srcs[0];
    box.appendChild(img);
    return box;
  }

  /* theme follows the homepage */
  try {
    var saved = localStorage.getItem('hp.theme');
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var mode = saved || (sys ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', mode);
    document.getElementById('themeLabel').textContent = mode === 'dark' ? 'dark' : 'light';
  } catch (e) {}

  var filterEl = document.getElementById('f');
  var wrap = document.getElementById('filterwrap');

  function match(text) {
    var q = filterEl.value.trim().toLowerCase();
    return !q || text.toLowerCase().indexOf(q) !== -1;
  }

  function renderSearches() {
    var el = document.getElementById('searches');
    el.innerHTML = '';
    var all = read(K.searches, []);
    var shown = 0;
    all.forEach(function (item) {
      var text = searchText(item);
      if (!text || !match(text)) return;
      shown++;
      var row = document.createElement('div'); row.className = 'row';
      var a = document.createElement('a');
      a.className = 'q';
      a.href = 'https://search.brave.com/search?q=' + encodeURIComponent(text);
      a.textContent = text;
      var em = document.createElement('em'); em.textContent = ago(item && item.t);
      var del = document.createElement('button');
      del.className = 'del'; del.type = 'button'; del.textContent = '×';
      del.setAttribute('aria-label', 'Remove');
      del.addEventListener('click', function () {
        row.classList.add('gone');
        setTimeout(function () {
          write(K.searches, read(K.searches, []).filter(function (x) { return searchText(x) !== text; }));
          renderAll();
        }, 150);
      });
      row.appendChild(a); row.appendChild(em); row.appendChild(del);
      el.appendChild(row);
    });
    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = all.length ? 'Nothing matches that filter.' : 'Nothing searched yet.';
      el.appendChild(e);
    }
    document.getElementById('cSearch').textContent = all.length ? all.length + '' : '';
  }

  function renderOpened() {
    var el = document.getElementById('opened');
    el.innerHTML = '';
    var all = read(K.opened, []);
    var shown = 0;
    all.forEach(function (o) {
      var label = (o.n || nice(o.u)) + ' ' + o.u;
      if (!match(label)) return;
      shown++;
      var row = document.createElement('div'); row.className = 'row';
      row.appendChild(makeIcon(o.u));
      var a = document.createElement('a');
      a.className = 'q'; a.href = o.u; a.textContent = o.n || nice(o.u);
      var em = document.createElement('em'); em.textContent = ago(o.t);
      var del = document.createElement('button');
      del.className = 'del'; del.type = 'button'; del.textContent = '×';
      del.setAttribute('aria-label', 'Remove');
      del.addEventListener('click', function () {
        row.classList.add('gone');
        setTimeout(function () {
          write(K.opened, read(K.opened, []).filter(function (x) { return x.u !== o.u; }));
          renderAll();
        }, 150);
      });
      row.appendChild(a); row.appendChild(em); row.appendChild(del);
      el.appendChild(row);
    });
    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = all.length ? 'Nothing matches that filter.' : 'No pages recorded yet.';
      el.appendChild(e);
    }
    document.getElementById('cOpened').textContent = all.length ? all.length + '' : '';
  }

  function renderSub() {
    var s = read(K.searches, []).length, o = read(K.opened, []).length;
    document.getElementById('sub').textContent =
      s + (s === 1 ? ' search' : ' searches') + ' · ' + o + (o === 1 ? ' page' : ' pages');
  }

  function renderAll() { renderSearches(); renderOpened(); renderSub(); }

  filterEl.addEventListener('input', function () {
    wrap.classList.toggle('has', filterEl.value.length > 0);
    renderAll();
  });
  document.getElementById('fclear').addEventListener('click', function () {
    filterEl.value = ''; wrap.classList.remove('has'); renderAll(); filterEl.focus();
  });
  document.getElementById('clearSearch').addEventListener('click', function () {
    if (!read(K.searches, []).length) return;
    if (!confirm('Clear all search history?')) return;
    write(K.searches, []); renderAll();
  });
  document.getElementById('clearOpened').addEventListener('click', function () {
    if (!read(K.opened, []).length) return;
    if (!confirm('Clear all opened pages?')) return;
    write(K.opened, []); renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
