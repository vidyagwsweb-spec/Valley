name: Build Valley APK

# Put valley-browser.zip in the root of this repository.
# This workflow unzips it and builds the APK for you.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          ls -la
          unzip -o Valley-Anchored-Menus-v4.zip -d .
          echo "--- project files ---"
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: valley-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
