<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee6">
<title>Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee6;
    --paper-2:#fffdfa;
    --card:#ffffff;
    --ink:#191410;
    --ink-2:#6d645a;
    --ink-3:#a2978b;
    --line:#e4dbcd;
    --line-2:#d3c7b5;
    --ember:#e8622a;
    --tint:rgba(232,98,42,.30);
    --shadow:0 1px 2px rgba(25,20,16,.04), 0 14px 34px rgba(25,20,16,.05);
    --shadow-2:0 1px 2px rgba(25,20,16,.035), 0 14px 34px rgba(25,20,16,.045);
    --serif:"Playfair Display",Georgia,"Iowan Old Style",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --spring:cubic-bezier(.34,1.28,.64,1);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;color:var(--ink);background:var(--paper);
    font:15px/1.55 var(--sans);
    padding:0 0 calc(46px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* paper texture: warm wash + time-of-day tint + faint grain */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(74% 52% at -2% -8%, var(--tint), transparent 66%),
      radial-gradient(90% 50% at 50% -12%, var(--glow) 0%, rgba(255,250,242,0) 60%),
      linear-gradient(180deg,var(--top) 0%,var(--paper) 46%,var(--bottom) 100%);
    transition:background .5s ease;
  }
  html{--top:#f6f1e9;--bottom:#efe8dd;--glow:#fffaf2}

  /* ---- dark ---- */
  html[data-theme="dark"]{
    --paper:#100e0c;--paper-2:#191613;--card:#1a1714;
    --ink:#f6f0e8;--ink-2:#b3a89c;--ink-3:#877e74;
    --line:#2b2521;--line-2:#3b332c;
    --top:#171412;--bottom:#0b0908;--glow:#241b15;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 38px rgba(0,0,0,.42);
    --shadow-2:0 1px 2px rgba(0,0,0,.28), 0 16px 38px rgba(0,0,0,.38);
    color-scheme:dark;
  }
  html[data-theme="dark"] body::after{opacity:.22;mix-blend-mode:screen}
  html[data-theme="dark"] #q{background:var(--card)}
  html[data-theme="dark"] .go{background:#f6f0e8;color:#14110f}
  html[data-theme="dark"] .search.typing .go{background:var(--ember);color:#150c07}
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='.22'/></svg>");
    mix-blend-mode:multiply;
  }

  .page{max-width:540px;margin:0 auto;padding:0 22px}

  /* ---------- credit ---------- */
  .creditrow{display:flex;align-items:center;justify-content:space-between;padding:20px 0 0;gap:12px}
  .gear{
    flex:0 0 auto;width:28px;height:28px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line-2);background:transparent;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:border-color .18s ease,color .18s ease,transform .2s var(--spring);
  }
  .gear:active{transform:scale(.92);border-color:var(--ember);color:var(--ember)}
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}

  /* collapsing menu */
  .menu{
    position:fixed;z-index:50;min-width:172px;padding:6px;
    border-radius:14px;border:1px solid var(--line-2);background:var(--card);
    box-shadow:0 18px 40px rgba(25,20,16,.18);
    opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;
    pointer-events:none;transition:opacity .16s ease,transform .18s var(--spring);
  }
  html[data-theme="dark"] .menu{box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .menu a,.menu button{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:10px 11px;border-radius:9px;border:0;background:transparent;
    color:var(--ink);text-decoration:none;text-align:left;cursor:pointer;
    font:500 13px var(--sans);transition:background .14s ease;
  }
  .menu a:active,.menu button:active{background:var(--fill-2)}
  .menu .hintk{color:var(--ink-3);font-size:11px}

  .theme{
    flex:0 0 auto;width:28px;height:28px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line-2);background:transparent;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:border-color .18s ease,color .18s ease,transform .2s var(--spring);
  }
  .theme:active{transform:scale(.92);border-color:var(--ember);color:var(--ember)}
  html[data-theme="light"] .i-moon{display:none}
  html[data-theme="dark"] .i-sun{display:none}
  .credit{
    padding:0;min-width:0;
    font-family:var(--serif);font-weight:600;font-size:9.5px;line-height:1;
    letter-spacing:.20em;text-transform:uppercase;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    animation:rise .8s var(--spring) both;
  }

  /* ---------- masthead ---------- */
  header{padding:26px 0 0;text-align:left}
  .mark{
    font-family:var(--serif);font-style:italic;font-weight:600;
    font-size:clamp(58px,17vw,76px);line-height:.86;letter-spacing:-.03em;
    color:var(--ink);margin:0;
    animation:rise .8s var(--spring) both;
  }
  .swipe{
    width:64px;height:4px;border-radius:3px;margin:14px 0 0 3px;
    background:linear-gradient(90deg,var(--ember),#f59a5f);
    animation:wipe .7s var(--ease) .12s both;
    transform-origin:left center;
  }
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .meta{
    display:flex;align-items:baseline;justify-content:space-between;
    flex-wrap:wrap;gap:6px 14px;
    margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font:500 9.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
    animation:rise .8s var(--spring) .16s both;
  }
  .meta > span{white-space:nowrap}
  .meta b{color:var(--ember);font-weight:600}
  .meta .right{display:inline-flex;align-items:center;gap:8px}
  .meta .right b{color:var(--line-2);font-weight:400}
  .wx{
    border:0;background:transparent;padding:0;cursor:pointer;
    font:600 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-3);transition:color .16s ease;
  }
  .wx:active,.wx:hover{color:var(--ember)}

  /* ---------- search ---------- */
  .search{position:relative;margin:26px 0 0;animation:rise .8s var(--spring) .2s both}
  #q{
    width:100%;height:58px;border-radius:14px;
    border:1px solid var(--line-2);background:var(--card);
    color:var(--ink);caret-color:var(--ember);
    font:500 15.5px var(--sans);
    padding:0 56px 0 48px;outline:none;
    box-shadow:var(--shadow);
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--spring);
  }
  #q::placeholder{color:#a89d90;font-weight:400}
  #q:focus{
    border-color:var(--ember);
    box-shadow:var(--shadow), 0 12px 34px rgba(232,98,42,.16);
  }
  .mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);pointer-events:none;
       transition:opacity .2s ease}
  .mag svg{stroke:#a89d90}
  .search.typing .mag svg{stroke:var(--ember)}
  .go{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:42px;height:42px;border-radius:10px;border:0;cursor:pointer;
    background:var(--ink);color:#fff;font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,transform .22s var(--spring);
  }
  .search.typing .go{background:var(--ember)}
  .go:active{transform:translateY(-50%) scale(.92)}
  .hintrow{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin:12px 0 30px;animation:rise .8s var(--spring) .26s both;
  }
  .hint{font-size:11.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint b{color:var(--ink-2);font-weight:500}

  /* smart search toggle */
  .smart{display:inline-flex;align-items:center;gap:7px;cursor:pointer;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
  .smart input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .smart .box{
    width:15px;height:15px;border-radius:4px;flex:0 0 auto;
    border:1px solid var(--line-2);background:transparent;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s ease,border-color .18s ease,transform .18s var(--spring);
  }
  .smart .box svg{opacity:0;transition:opacity .14s ease}
  .smart input:checked + .box{background:var(--ember);border-color:var(--ember)}
  .smart input:checked + .box svg{opacity:1}
  .smart:active .box{transform:scale(.9)}
  .smart .txt{
    font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);transition:color .18s ease;
  }
  .smart input:checked ~ .txt{color:var(--ink-2)}
  /* ---------- sections ---------- */
  .block{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px;margin-bottom:11px;
    box-shadow:var(--shadow-2);
    animation:rise .8s var(--spring) .3s both;
  }
  .block + .block{animation-delay:.36s}

  .head{
    display:flex;align-items:center;gap:10px;margin:0 0 14px;
  }
  .sep{height:1px;background:var(--line);margin:16px 0}
  .head h2{
    margin:0;flex:0 0 auto;
    font:600 9.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);
  }
  .head .line{flex:1 1 auto;height:1px;background:var(--line)}
  .head button{
    flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
    font:600 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;
    padding:2px 0;transition:color .16s ease;
  }
  .head button:active{color:var(--ember)}

  /* ---------- fast dial ---------- */
  .dial{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{
    position:relative;aspect-ratio:1;border-radius:13px;
    border:1px solid var(--line);background:var(--paper-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;overflow:hidden;
    transition:transform .2s var(--spring),box-shadow .2s ease,border-color .2s ease,opacity .18s ease;
    animation:tileIn .5s var(--spring) both;
    animation-delay:calc(var(--i,0) * 40ms + 340ms);
  }
  @keyframes tileIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .tile:active{
    transform:scale(.94);border-color:var(--line-2);
    box-shadow:0 6px 16px rgba(0,0,0,.14);
  }
  .tile.out{opacity:0;transform:scale(.85)}
  .tile .ic{
    position:relative;width:30px;height:30px;border-radius:9px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font:600 13px/1 var(--sans);color:#fff;
  }
  .ic .mono{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:600 13px/1 var(--sans);color:#fff;
  }
  .chip .ic .mono,.row .ic .mono{font-size:9px}
  .tile .ic img{position:absolute;inset:0;width:100%;height:100%;border-radius:9px;display:block}
  .tile .nm{
    max-width:100%;padding:0 6px;font-size:10.5px;font-weight:500;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tile .x{
    position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:999px;
    border:0;background:rgba(25,20,16,.72);color:#fff;font-size:11px;line-height:1;
    display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2;
  }
  body.editing .tile .x{display:flex}
  .tile.add{border-style:dashed;border-color:var(--line-2);background:transparent}
  .tile.add .ic{background:transparent;color:var(--ink-3);font-weight:400;font-size:20px}
  .tile.add .nm{color:var(--ink-3)}

  /* ---------- chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:8px;max-width:100%;
    padding:8px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper-2);color:var(--ink);text-decoration:none;font-size:12.5px;
    transition:background .16s ease,border-color .16s ease,transform .18s var(--spring),opacity .18s ease;
  }
  .chip:active{background:#fff;border-color:var(--line-2);transform:scale(.97)}
  .chip.out{opacity:0;transform:scale(.9)}
  .chip .ic{
    position:relative;width:16px;height:16px;border-radius:5px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font:600 9px/1 var(--sans);color:#fff;
  }
  .chip .ic img{position:absolute;inset:0;width:100%;height:100%;border-radius:5px;display:block}
  .chip span{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .x{border:0;background:transparent;color:var(--ink-3);font-size:13px;line-height:1;
           padding:0;display:none;cursor:pointer}
  body.editing .chip .x{display:inline-block}

  .qchip{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 8px 7px 12px;border-radius:999px;
    border:1px dashed var(--line-2);background:transparent;
    color:var(--ink-2);font-size:12.5px;cursor:pointer;
    transition:border-color .16s ease,color .16s ease,background .16s ease;
  }
  .qchip:active{border-color:var(--ember);color:var(--ink);background:#fff8f2}
  .qchip span{max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qchip b{font-weight:400;color:var(--ink-3);font-size:14px;line-height:1;padding:0 3px;cursor:pointer}

  /* ---------- rows ---------- */
  .rows{display:flex;flex-direction:column}
  .row{
    display:flex;align-items:center;gap:11px;padding:11px 0;
    color:var(--ink);text-decoration:none;font-size:13px;
    border-bottom:1px solid var(--line);
    transition:opacity .16s ease;
  }
  .row:last-child{border-bottom:0;padding-bottom:2px}
  .row:active{opacity:.55}
  .row .ic{
    position:relative;width:18px;height:18px;border-radius:6px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font:600 9.5px/1 var(--sans);color:#fff;
  }
  .row .ic img{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;display:block}
  .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row em{
    margin-left:auto;font-style:normal;color:var(--ink-3);font-size:11px;flex:0 0 auto;
    font-variant-numeric:tabular-nums;
  }
  .row .del{
    flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);
    font:400 16px/1 var(--sans);padding:2px 0 2px 10px;cursor:pointer;
    transition:color .15s ease,opacity .15s ease;
  }
  .row .del:active{color:var(--ember)}
  .row.gone{opacity:0;transform:translateX(6px);transition:opacity .15s ease,transform .15s ease}

  .empty{color:var(--ink-3);font-size:12.5px;padding:0 0 2px}

  /* ---------- scratchpad ---------- */
  #pad{
    display:block;width:100%;min-height:74px;resize:none;overflow:hidden;
    border:0;outline:none;background:transparent;color:var(--ink);
    font:400 13.5px/1.6 var(--sans);padding:0;margin:0 0 14px;
    caret-color:var(--ember);
  }
  #pad::placeholder{color:var(--ink-3)}

  footer{
    margin-top:20px;text-align:center;color:var(--ink-3);
    font:500 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
    animation:rise .8s var(--spring) .42s both;
  }
  footer button{
    border:0;background:transparent;color:var(--ink-2);cursor:pointer;
    font:500 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
    text-decoration:underline;text-underline-offset:3px;padding:0;
  }

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="creditrow">
    <div class="credit">MADE BY MANISH WITH INDUS - 2026</div>
    <button class="gear" id="gear" aria-label="Menu">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.1a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
      </svg>
    </button>
    <div class="tools">
    <button class="theme" id="theme" aria-label="Toggle theme">
      <svg class="i-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
      </svg>
      <svg class="i-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.4 8.4 0 1 0 20 14.5Z"/>
      </svg>
    </button>
    </div>
  </div>
  <div class="menu" id="menu">
    <a href="history.html">History <span class="hintk">→</span></a>
    <a href="about.html">About <span class="hintk">→</span></a>
    <button id="menuReset">Reset everything</button>
  </div>

  <header>
    <h1 class="mark">Valley</h1>
    <div class="swipe"></div>
    <div class="meta">
      <span id="greet">—</span>
      <span class="right"><button id="wx" class="wx" title="Set location">—</button><b>·</b><span id="today">—</span></span>
    </div>
  </header>

  <div class="search" id="searchwrap">
    <span class="mag">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.7-3.7"/>
      </svg>
    </span>
    <input id="q" type="search" placeholder="Search or enter address" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="go" id="go" aria-label="Go">→</button>
  </div>
  <div class="hintrow">
    <span class="hint"><b>google.com</b> or <b>what is a valley?</b></span>
    <label class="smart" for="smart">
      <input type="checkbox" id="smart" checked>
      <span class="box"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.6 9 10 3.2"/></svg></span>
      <span class="txt">Smart search</span>
    </label>
  </div>

  <div class="block">
    <div class="head"><h2>Fast dial</h2><span class="line"></span><button id="editBtn">Edit</button></div>
    <div class="dial" id="dial"></div>
  </div>

  <div class="block">
    <div class="head"><h2>Favourites</h2><span class="line"></span><button id="favAdd">Add</button></div>
    <div class="chips" id="favs"></div>
    <div class="sep"></div>
    <div class="head"><h2>Recent searches</h2><span class="line"></span><button id="clearSearches">Clear</button></div>
    <div class="chips" id="recent"></div>
  </div>

  <div class="block">
    <div class="head"><h2>Recently opened</h2><span class="line"></span><button id="clearOpened">Clear</button></div>
    <div class="rows" id="opened"></div>
  </div>

  <div class="block">
    <div class="head"><h2>Scratchpad</h2><span class="line"></span><button id="padClear">Clear</button></div>
    <textarea id="pad" rows="3" placeholder="Notes, a link to come back to, anything…" spellcheck="false"></textarea>
  </div>

  <footer>Saved in this browser · <button id="reset">reset</button></footer>
</div>

<script>
(function () {
  var K = { dial:'hp.dial', favs:'hp.favs', searches:'hp.searches', opened:'hp.opened' };

  function read(key, fb) {
    try { var raw = localStorage.getItem(key); if (!raw) return fb;
          var v = JSON.parse(raw); return v == null ? fb : v; } catch (e) { return fb; }
  }
  function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

  function nice(u) {
    var h = host(u); if (!h) return u;
    var parts = h.split('.'); if (parts.length > 1) parts.pop();
    var skip = { www:1, en:1, m:1, mobile:1 };
    var name = '';
    for (var i = 0; i < parts.length; i++) if (!skip[parts[i]]) { name = parts[i]; break; }
    if (!name) name = parts[0] || h;
    return name.charAt(0).toUpperCase() + name.slice(1);
  }
  function tint(u) {
    var h = host(u) || 'x', n = 0;
    for (var i = 0; i < h.length; i++) n = (n * 31 + h.charCodeAt(i)) % 360;
    return 'hsl(' + n + ', 52%, 42%)';   // comma syntax: parses reliably in style.background
  }
  function initial(u) { return (nice(u) || '?').charAt(0).toUpperCase(); }

  function makeIcon(u, cls, size) {
    var box = document.createElement('div');
    box.className = cls;
    box.style.background = tint(u);
    var mono = document.createElement('span');
    mono.className = 'mono';
    mono.textContent = initial(u);
    box.appendChild(mono);
    var img = document.createElement('img');
    img.alt = ''; img.decoding = 'async';
    var h = host(u), sz = size || 64;
    var sources = [
      'https://' + h + '/favicon.ico',                       // the site's own, most reliable
      'https://icons.duckduckgo.com/ip3/' + h + '.ico',
      'https://www.google.com/s2/favicons?sz=' + sz + '&domain=' + h
    ];
    var n = 0;
    function next() {
      n++;
      if (n < sources.length) { img.src = sources[n]; return; }
      if (img.parentNode) img.parentNode.removeChild(img);   // monogram stays visible
    }
    img.onerror = next;
    img.onload = function () {
      // some hosts answer with a blank placeholder; treat anything under 16px as empty
      if (!img.naturalWidth || img.naturalWidth < 16) next();
    };
    img.src = sources[0];
    box.appendChild(img);
    return box;
  }

  /* theme */
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme');
    function paint(mode) {
      root.setAttribute('data-theme', mode);
      try { localStorage.setItem('hp.theme', mode); } catch (e) {}
      paintTimeTint();
    }
    var saved = null;
    try { saved = localStorage.getItem('hp.theme'); } catch (e) {}
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    paint(saved || (sys ? 'dark' : 'light'));
    btn.addEventListener('click', function () {
      paint(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();

  /* time-of-day tint: 5am ultramarine, 10am pale yellow, 3pm orange,
     6pm lavender, 10pm navy - interpolated, wrapping past midnight */
  function paintTimeTint() {
    var anchors = [
      { h: 5,  c: [58, 82, 190] },    // ultramarine
      { h: 10, c: [243, 226, 150] },  // pale yellow
      { h: 15, c: [232, 98, 42] },    // orange
      { h: 18, c: [178, 158, 226] },  // lavender
      { h: 22, c: [26, 42, 96] }      // navy
    ];
    var now = new Date();
    var t = now.getHours() + now.getMinutes() / 60;
    var a, b;
    for (var i = 0; i < anchors.length; i++) {
      var cur = anchors[i], nxt = anchors[(i + 1) % anchors.length];
      var start = cur.h, end = nxt.h + (i === anchors.length - 1 ? 24 : 0);
      var tt = t < start && i === anchors.length - 1 ? t + 24 : t;
      if (tt >= start && tt < end) { a = cur; b = nxt; break; }
    }
    if (!a) { a = anchors[0]; b = anchors[1]; }
    var start2 = a.h, end2 = b.h + (b.h < a.h ? 24 : 0);
    var t2 = t < start2 ? t + 24 : t;
    var f = Math.max(0, Math.min(1, (t2 - start2) / (end2 - start2)));
    var col = a.c.map(function (v, k) { return Math.round(v + (b.c[k] - v) * f); });
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.style.setProperty(
      '--tint',
      'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (dark ? 0.32 : 0.30) + ')'
    );
  }
  setInterval(paintTimeTint, 600000);

  /* masthead meta */
  (function () {
    var d = new Date(), h = d.getHours();
    var g = h < 5 ? 'Still awake' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon'
          : h < 21 ? 'Good evening' : 'Good night';
    document.getElementById('greet').innerHTML = g + ' <b>·</b> ' +
      (h < 12 ? 'begin' : h < 17 ? 'carry on' : 'unwind');
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('today').textContent =
      days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
  })();

  /* routing */
  var SITES = {
    flipkart:'https://www.flipkart.com/search?q=', amazon:'https://www.amazon.in/s?k=',
    myntra:'https://www.myntra.com/search?q=', ajio:'https://www.ajio.com/search/?text=',
    croma:'https://www.croma.com/searchB?q=', snapdeal:'https://www.snapdeal.com/search?keyword=',
    meesho:'https://www.meesho.com/search?q=', nykaa:'https://www.nykaa.com/search/result/?q=',
    tatacliq:'https://www.tatacliq.com/search/?searchCategory=all&text=',
    reliancedigital:'https://www.reliancedigital.in/search?q=',
    swiggy:'https://www.swiggy.com/search?query=', zomato:'https://www.zomato.com/search?q=',
    bookmyshow:'https://in.bookmyshow.com/explore/movies?q=', paytm:'https://paytm.com/',
    github:'https://github.com/search?q=', wikipedia:'https://en.wikipedia.org/w/index.php?search=',
    youtube:'https://www.youtube.com/results?search_query=', reddit:'https://www.reddit.com/search/?q=',
    stackoverflow:'https://stackoverflow.com/search?q=', quora:'https://www.quora.com/search?q=',
    imdb:'https://www.imdb.com/find?q=', cricbuzz:'https://www.cricbuzz.com/search?q=',
    ndtv:'https://www.ndtv.com/search?searchtext='
  };
  // a question is a question: naming a site inside it must not hijack the search
  function isQuestion(q) {
    if (/\?\s*$/.test(q)) return true;
    return /^(what|who|whom|whose|why|how|when|where|which|is|are|was|were|am|do|does|did|can|could|should|would|will|has|have|had)\b/i
      .test(q.replace(/^\s+/, ''));
  }

  // nearest-name matching, used only after a navigation verb ("open flipkrt")
  var KNOWN = [
    'google.com','youtube.com','facebook.com','instagram.com','whatsapp.com','x.com','twitter.com',
    'reddit.com','wikipedia.org','linkedin.com','pinterest.com','quora.com','medium.com',
    'github.com','gitlab.com','stackoverflow.com','npmjs.com','vercel.com','netlify.com',
    'amazon.in','amazon.com','flipkart.com','myntra.com','ajio.com','meesho.com','snapdeal.com',
    'nykaa.com','croma.com','reliancedigital.in','tatacliq.com','paytm.com','phonepe.com',
    'swiggy.com','zomato.com','zepto.com','blinkit.com','bigbasket.com','bookmyshow.com',
    'makemytrip.com','irctc.co.in','redbus.in','uber.com',
    'ndtv.com','thehindu.com','hindustantimes.com','indianexpress.com',
    'bbc.com','cnn.com','reuters.com','theguardian.com','nytimes.com',
    'netflix.com','primevideo.com','hotstar.com','spotify.com','soundcloud.com',
    'imdb.com','cricbuzz.com','espn.com',
    'apple.com','microsoft.com','samsung.com','oneplus.in','mi.com','realme.com','vivo.com',
    'adobe.com','figma.com','canva.com','notion.so','slack.com','discord.com','telegram.org',
    'chatgpt.com','claude.ai','perplexity.ai','sarvam.ai',
    'accuweather.com','timeanddate.com','britannica.com','dictionary.com',
    'archive.org','wordpress.com','substack.com'
  ];

  function editDistance(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    var prev = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      var cur = [i];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function nearestSite(word) {
    var w = String(word).toLowerCase().replace(/[^a-z0-9]/g, '');
    if (w.length < 3) return null;
    var best = null, bestD = 99;
    for (var i = 0; i < KNOWN.length; i++) {
      var host = KNOWN[i];
      var base = host.split('.')[0].replace(/[^a-z0-9]/g, '');
      var d = editDistance(w, base);
      if (base.indexOf(w) === 0) d = Math.min(d, 1);          // "flipk" -> flipkart
      if (d < bestD) { bestD = d; best = host; }
    }
    var limit = w.length <= 4 ? 1 : (w.length <= 7 ? 2 : 3);
    return (best && bestD <= limit) ? 'https://' + best : null;
  }

  // "open flipkart" / "go to example.com" - a navigation verb means go there, not search
  var NAV = /^(?:open|go\s+to|goto|visit|launch)\s+(.+)$/i;

  function navTarget(t) {
    t = t.trim().replace(/[.。,'"]+$/, '').trim();
    if (!t) return null;
    // a known site name -> its own home page
    var key = t.toLowerCase().replace(/\s+/g, '');
    if (SITES[key]) {
      try { return new URL(SITES[key]).origin; } catch (e) {}
    }
    // a bare single word -> nearest known site first, then the .com guess
    if (/^[a-z0-9-]+$/i.test(t)) {
      return nearestSite(t) || ('https://' + t.toLowerCase() + '.com');
    }
    // something with a dot -> an address
    if (/^[^\s\/?#]+\.[a-z]{2,}([\/?#].*)?$/i.test(t)) return 'https://' + t;
    return null;
  }

  function route(q, smart) {
    var scheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(q);
    var bare = !scheme && !/\s/.test(q) && /^[^\s\/?#]+\.[a-z]{2,}([\/?#].*)?$/i.test(q);
    if (scheme) return q;
    if (bare) return 'https://' + q;
    var nav = q.match(NAV);
    if (nav) {
      var target = navTarget(nav[1]);
      if (target) return target;
    }
    if (smart === false) return 'https://search.brave.com/search?q=' + encodeURIComponent(q);
    if (isQuestion(q)) return 'https://search.brave.com/search?q=' + encodeURIComponent(q);

    var hit = '', name = '';
    for (var k in SITES) {
      if (Object.prototype.hasOwnProperty.call(SITES, k) &&
          new RegExp('\\b' + k + '\\b','i').test(q)) { hit = SITES[k]; name = k; break; }
    }
    if (hit) {
      // drop the site name and only the filler around it - never words from the middle
      var terms = q.replace(new RegExp('\\b' + name + '\\b','ig'), ' ')
                   .replace(/^\s*(price of|prices|price|cost of|cost|buy|buying|best|where to buy|order)\s+/i, '')
                   .replace(/\s+\b(on|from|at|in)\s*$/i, '')
                   .replace(/\s+/g, ' ').trim();
      return hit + encodeURIComponent(terms || q);
    }
    return 'https://search.brave.com/search?q=' + encodeURIComponent(q);
  }

  /* fast dial */
  var DEFAULT_DIAL = [
    { u:'https://www.google.com', n:'Google' },
    { u:'https://www.youtube.com', n:'YouTube' },
    { u:'https://en.wikipedia.org', n:'Wikipedia' },
    { u:'https://www.flipkart.com', n:'Flipkart' },
    { u:'https://www.amazon.in', n:'Amazon' },
    { u:'https://github.com', n:'GitHub' },
    { u:'https://www.ndtv.com', n:'NDTV' }
  ];
  function getDial() { var d = read(K.dial, null); return d && d.length ? d : DEFAULT_DIAL.slice(); }

  function renderDial() {
    var el = document.getElementById('dial'); el.innerHTML = '';
    getDial().forEach(function (t, i) {
      var a = document.createElement('a');
      a.className = 'tile'; a.href = t.u; a.style.setProperty('--i', i);
      a.appendChild(makeIcon(t.u, 'ic', 64));
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = t.n || nice(t.u);
      var x = document.createElement('button');
      x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label','Remove');
      x.addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        a.classList.add('out');
        setTimeout(function () {
          write(K.dial, getDial().filter(function (_, j) { return j !== i; }));
          renderDial();
        }, 170);
      });
      a.appendChild(x); a.appendChild(nm);
      el.appendChild(a);
    });
    var add = document.createElement('button');
    add.className = 'tile add'; add.style.setProperty('--i', getDial().length);
    var ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = '+';
    var nm2 = document.createElement('div'); nm2.className = 'nm'; nm2.textContent = 'Add';
    add.appendChild(ic); add.appendChild(nm2);
    add.addEventListener('click', function () {
      var u = prompt('Address (e.g. example.com)'); if (!u) return;
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
      var n = prompt('Name (optional)', nice(u)) || nice(u);
      var next = getDial(); next.push({ u: u, n: n }); write(K.dial, next); renderDial();
    });
    el.appendChild(add);
  }
  document.getElementById('editBtn').addEventListener('click', function () {
    var on = document.body.classList.toggle('editing');
    this.textContent = on ? 'Done' : 'Edit';
  });

  /* favourites */
  function getFavs() { return read(K.favs, []); }
  function renderFavs() {
    var el = document.getElementById('favs'); el.innerHTML = '';
    var favs = getFavs();
    if (!favs.length) {
      var e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'Nothing pinned yet — Add puts a site here.';
      el.appendChild(e); return;
    }
    favs.forEach(function (f, i) {
      var a = document.createElement('a'); a.className = 'chip'; a.href = f.u;
      a.appendChild(makeIcon(f.u, 'ic', 32));
      var s = document.createElement('span'); s.textContent = f.n || nice(f.u);
      var x = document.createElement('button'); x.className = 'x'; x.textContent = '×';
      x.addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        a.classList.add('out');
        setTimeout(function () {
          write(K.favs, getFavs().filter(function (_, j) { return j !== i; }));
          renderFavs();
        }, 170);
      });
      a.appendChild(s); a.appendChild(x);
      el.appendChild(a);
    });
  }
  document.getElementById('favAdd').addEventListener('click', function () {
    var u = prompt('Address'); if (!u) return;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
    var n = prompt('Name (optional)', nice(u)) || nice(u);
    var next = getFavs(); next.push({ u: u, n: n }); write(K.favs, next); renderFavs();
  });

  /* searches */
  function getSearches() { return read(K.searches, []); }
  var CAP = 200;              // stored; the homepage still shows 8
  var SHOW = 8;

  function searchText(x) { return typeof x === 'string' ? x : (x && x.q) || ''; }

  function addSearch(q) {
    var a = getSearches().filter(function (x) { return searchText(x) !== q; });
    a.unshift({ q: q, t: Date.now() });
    write(K.searches, a.slice(0, CAP));
  }
  function renderSearches() {
    var el = document.getElementById('recent'); el.innerHTML = '';
    var list = getSearches().slice(0, SHOW);
    if (!list.length) {
      var e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'Nothing searched yet.';
      el.appendChild(e); return;
    }
    list.forEach(function (item, i) {
      var q = searchText(item);
      var c = document.createElement('div'); c.className = 'qchip';
      var s = document.createElement('span'); s.textContent = q;
      var b = document.createElement('b'); b.textContent = '×';
      s.addEventListener('click', function () { go(q); });
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        write(K.searches, getSearches().filter(function (x) { return searchText(x) !== q; }));
        renderSearches();
      });
      c.appendChild(s); c.appendChild(b);
      el.appendChild(c);
    });
  }
  document.getElementById('clearSearches').addEventListener('click', function () {
    write(K.searches, []); renderSearches();
  });

  /* opened */
  function getOpened() { return read(K.opened, []); }
  function addOpened(u, label) {
    var a = getOpened().filter(function (x) { return x.u !== u; });
    a.unshift({ u: u, n: label || nice(u), t: Date.now() });
    write(K.opened, a.slice(0, CAP));
  }
  function removeOpened(u) {
    write(K.opened, getOpened().filter(function (x) { return x.u !== u; }));
  }
  function clearOpened() {
    write(K.opened, []);
  }
  function ago(ts) {
    var s = Math.max(1, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.round(s / 60) + 'm';
    if (s < 86400) return Math.round(s / 3600) + 'h';
    return Math.round(s / 86400) + 'd';
  }
  function renderOpened() {
    var el = document.getElementById('opened'); el.innerHTML = '';
    var list = getOpened().slice(0, SHOW);
    if (!list.length) {
      var e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'Pages you open from here appear here.';
      el.appendChild(e); return;
    }
    list.forEach(function (o) {
      var a = document.createElement('a'); a.className = 'row'; a.href = o.u;
      a.appendChild(makeIcon(o.u, 'ic', 32));
      var s = document.createElement('span'); s.textContent = o.n;
      var em = document.createElement('em'); em.textContent = ago(o.t);
      var del = document.createElement('button');
      del.className = 'del'; del.type = 'button';
      del.textContent = '\u00d7';
      del.setAttribute('aria-label', 'Remove');
      del.addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        a.classList.add('gone');
        setTimeout(function () { removeOpened(o.u); renderOpened(); }, 150);
      });
      a.appendChild(s); a.appendChild(em); a.appendChild(del);
      el.appendChild(a);
    });
  }

  /* go */
  function smartOn() {
    var el = document.getElementById('smart');
    return !el || el.checked;
  }
  function go(q) {
    q = (q || '').trim(); if (!q) return;
    var url = route(q, smartOn());
    addSearch(q); addOpened(url, q);
    location.href = url;
  }
  var input = document.getElementById('q');
  var wrap = document.getElementById('searchwrap');

  /* smart search: remembered between visits */
  (function () {
    var box = document.getElementById('smart');
    try {
      var saved = localStorage.getItem('hp.smart');
      if (saved === '0') box.checked = false;
    } catch (e) {}
    box.addEventListener('change', function () {
      try { localStorage.setItem('hp.smart', box.checked ? '1' : '0'); } catch (e) {}
    });
  })();
  input.addEventListener('input', function () {
    wrap.classList.toggle('typing', input.value.trim().length > 0);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); go(input.value); }
  });
  document.getElementById('go').addEventListener('click', function () { go(input.value); });

  /* settings menu */
  (function () {
    var gear = document.getElementById('gear');
    var menu = document.getElementById('menu');
    function place() {
      var r = gear.getBoundingClientRect();
      var vw = window.innerWidth || 360;
      var w = menu.offsetWidth || 176;
      var left = Math.min(vw - w - 10, Math.max(10, r.right - w));
      menu.style.left = left + 'px';
      menu.style.right = 'auto';
      menu.style.top = Math.round(r.bottom + 8) + 'px';
    }
    function close() { menu.classList.remove('open'); }
    gear.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.classList.toggle('open');
      if (open) place();
    });
    menu.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', close);
    document.addEventListener('scroll', close, true);
  })();

  document.getElementById('clearOpened').addEventListener('click', function () {
    if (!getOpened().length) return;
    if (!confirm('Clear the recently opened list?')) return;
    clearOpened(); renderOpened();
  });

  function doReset() {
    if (!confirm('Clear fast dial, favourites, searches and recent pages?')) return;
    [K.dial, K.favs, K.searches, K.opened].forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
    });
    renderDial(); renderFavs(); renderSearches(); renderOpened();
  }
  document.getElementById('menuReset').addEventListener('click', doReset);
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('Clear fast dial, favourites, searches and recent pages?')) return;
    [K.dial, K.favs, K.searches, K.opened].forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
    });
    renderDial(); renderFavs(); renderSearches(); renderOpened();
  });

  renderDial(); renderFavs(); renderSearches(); renderOpened();

  /* ---------- scratchpad ---------- */
  (function () {
    var pad = document.getElementById('pad');
    var t = null;
    function grow() {
      pad.style.height = 'auto';
      pad.style.height = Math.max(74, pad.scrollHeight) + 'px';
    }
    try { pad.value = localStorage.getItem('hp.pad') || ''; } catch (e) {}
    grow();
    pad.addEventListener('input', function () {
      grow();
      clearTimeout(t);
      t = setTimeout(function () {
        try { localStorage.setItem('hp.pad', pad.value); } catch (e) {}
      }, 300);
    });
    document.getElementById('padClear').addEventListener('click', function () {
      if (!pad.value.trim() || !confirm('Clear the scratchpad?')) return;
      pad.value = '';
      try { localStorage.removeItem('hp.pad'); } catch (e) {}
      grow();
    });
  })();

  /* ---------- weather (Open-Meteo, no key) ---------- */
  (function () {
    var btn = document.getElementById('wx');
    var WMO = {
      0:'clear', 1:'mostly clear', 2:'partly cloudy', 3:'overcast',
      45:'fog', 48:'fog',
      51:'light drizzle', 53:'drizzle', 55:'drizzle',
      56:'freezing drizzle', 57:'freezing drizzle',
      61:'light rain', 63:'rain', 65:'heavy rain',
      66:'freezing rain', 67:'freezing rain',
      71:'light snow', 73:'snow', 75:'heavy snow', 77:'snow grains',
      80:'showers', 81:'showers', 82:'heavy showers',
      85:'snow showers', 86:'snow showers',
      95:'thunderstorm', 96:'thunderstorm', 99:'thunderstorm'
    };

    function saved() {
      try { return JSON.parse(localStorage.getItem('hp.weather') || 'null'); } catch (e) { return null; }
    }
    function keep(loc) {
      try { localStorage.setItem('hp.weather', JSON.stringify(loc)); } catch (e) {}
    }
    function show(text) { btn.textContent = text; }

    function fetchFor(loc) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat +
                '&longitude=' + loc.lon + '&current=temperature_2m,weather_code&timezone=auto';
      fetch(url).then(function (r) { return r.json(); }).then(function (d) {
        var c = d && d.current;
        if (!c || typeof c.temperature_2m !== 'number') { show('—'); return; }
        var t = Math.round(c.temperature_2m);
        var w = WMO[c.weather_code] || '';
        show(t + '\u00b0' + (w ? ' ' + w : ''));
        btn.title = (loc.name ? loc.name + ' \u00b7 ' : '') + 'tap to change';
      }).catch(function () { show('—'); });
    }

    function askCity() {
      var name = prompt('City for weather', (saved() && saved().name) || '');
      if (!name) return;
      fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' +
            encodeURIComponent(name))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var hit = d && d.results && d.results[0];
          if (!hit) { show('not found'); return; }
          var loc = { lat: hit.latitude, lon: hit.longitude,
                      name: hit.name + (hit.country_code ? ', ' + hit.country_code : '') };
          keep(loc); fetchFor(loc);
        })
        .catch(function () { show('—'); });
    }

    btn.addEventListener('click', askCity);

    var loc = saved();
    if (loc) { fetchFor(loc); return; }

    if (navigator.geolocation) {
      show('\u2026');
      navigator.geolocation.getCurrentPosition(function (p) {
        var l = { lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3), name: '' };
        keep(l); fetchFor(l);
      }, function () { show('set city'); }, { timeout: 8000, maximumAge: 600000 });
    } else {
      show('set city');
    }
  })();
})();
</script>
